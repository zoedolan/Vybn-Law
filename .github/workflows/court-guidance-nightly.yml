name: Court Guidance nightly return

on:
  schedule:
    # Always after midnight in America/Los_Angeles (00:15 PST / 01:15 PDT).
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: court-guidance-nightly-return
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Preserve the day and generate its public return
        env:
          SUMMARY_TOKEN: ${{ secrets.COURT_GUIDANCE_SUMMARY_TOKEN }}
        run: |
          test -n "$SUMMARY_TOKEN"
          curl --fail-with-body --silent --show-error \
            --retry 4 --retry-delay 20 --retry-all-errors --max-time 600 \
            -X POST \
            -H "Authorization: Bearer $SUMMARY_TOKEN" \
            https://vybn-court-guidance.hf.space/api/admin/nightly
